# Имя приложения используется инфраструктурой Spring и в логах.
spring.application.name=product-cloud
# ${ИМЯ:значение} читает переменную окружения, иначе берёт значение после двоеточия.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products}
# Пользователь PostgreSQL; имя можно переопределить через DB_USERNAME.
spring.datasource.username=${DB_USERNAME:postgres}
# Пароль обязателен для основного профиля: реальный секрет не хранится в Git.
spring.datasource.password=${DB_PASSWORD}
# update изменяет схему под сущности для учебной разработки; это не замена миграциям и резервным копиям.
spring.jpa.hibernate.ddl-auto=update
# false закрывает JPA-контекст до рендеринга страницы: шаблон работает с DTO, не выполняя ленивые запросы.
spring.jpa.open-in-view=false
# По умолчанию сервер доступен только на этом компьютере; внешний доступ включается явно.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Не включаем внутренние сообщения исключений в стандартный HTTP-ответ об ошибке.
server.error.include-message=never
