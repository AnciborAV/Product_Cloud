<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Cloud — каталог товаров</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main class="workspace">
    <header>
        <p class="eyebrow">PRODUCT CLOUD</p>
        <h1>Каталог товаров</h1>
        <p class="muted">Названия и цены в одном месте.</p>
    </header>
    <p class="notice" role="status" th:if="${success}" th:text="${success}"></p>
    <div class="layout">
        <section class="panel" aria-labelledby="catalog-heading">
            <div class="panel-heading">
                <h2 id="catalog-heading">Товары</h2>
                <span class="badge" th:text="${products.totalElements}">0</span>
            </div>
            <p class="empty" th:if="${products.empty}">Здесь пока нет товаров. Добавьте первый.</p>
            <div class="table-scroll" th:unless="${products.empty}">
                <table>
                    <thead><tr><th scope="col">Название</th><th scope="col" class="price">Цена</th></tr></thead>
                    <tbody>
                    <tr th:each="product : ${products.content}">
                        <td th:text="${product.name}"></td>
                        <td class="price" th:text="${#numbers.formatDecimal(product.price, 1, 'WHITESPACE', 2, 'COMMA')}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav class="pagination" aria-label="Страницы каталога" th:if="${products.totalPages > 1}">
                <a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number - 1})}">← Назад</a>
                <span th:text="|Страница ${products.number + 1} из ${products.totalPages}|"></span>
                <a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number + 1})}">Далее →</a>
            </nav>
        </section>
        <section class="panel" aria-labelledby="form-heading">
            <h2 id="form-heading">Новый товар</h2>
            <form th:action="@{/products}" th:object="${productForm}" method="post">
                <label for="name">Название</label>
                <input id="name" th:field="*{name}" maxlength="255" required aria-describedby="name-error">
                <p id="name-error" class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                <label for="price">Цена</label>
                <input id="price" type="number" th:field="*{price}" min="0" step="0.01" required aria-describedby="price-error">
                <p id="price-error" class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                <button type="submit">Добавить товар</button>
            </form>
        </section>
    </div>
</main>
</body>
</html>
