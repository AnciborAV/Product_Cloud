# Профиль demo заменяет настройки основного файла: H2 сохраняет данные в папке data относительно запуска.
spring.datasource.url=jdbc:h2:file:./data/products;DB_CLOSE_ON_EXIT=FALSE
# Локальный пользователь встроенной H2; это не учётная запись PostgreSQL.
spring.datasource.username=sa
# Пустой пароль только для локального учебного demo-профиля.
spring.datasource.password=
