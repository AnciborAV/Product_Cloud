# TEST_DB_URL задаёт отдельную тестовую БД в CI; по умолчанию H2 живёт в памяти процесса.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:products-test;DB_CLOSE_DELAY=-1}
# Учётная запись тестовой базы; локальное значение по умолчанию — sa.
spring.datasource.username=${TEST_DB_USERNAME:sa}
# Пароль тестовой базы из окружения, локально пустой.
spring.datasource.password=${TEST_DB_PASSWORD:}
# ОСТОРОЖНО: create-drop создаёт схему и удаляет её при завершении. Не подключать к базе с нужными данными!
spring.jpa.hibernate.ddl-auto=create-drop
# Как в основном приложении, представление не должно обращаться к открытой JPA-сессии.
spring.jpa.open-in-view=false
