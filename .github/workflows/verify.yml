name: Verify application and Docker image
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Build Render Docker image
        run: docker build --tag product-cloud:verify .
      - name: Start image with PostgreSQL and check HTTP
        run: bash .github/scripts/render-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports
