<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Заказ сохранён · Тихая полка</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">▥ Тихая полка</a></header><main><div class="receipt"><span class="eyebrow">СПАСИБО ЗА ВАШ ВЫБОР</span><h1>Хорошие книги<br><em>уже ближе.</em></h1><p>Учебный заказ сохранён в PostgreSQL. Оплата не взимается, доставка не выполняется.</p><ul class="order-lines"><li th:each="line : ${order.lines()}"><span th:text="${line.title() + ' × ' + line.quantity()}">Книга</span><strong th:text="${line.subtotal() + ' ₽'}">Цена</strong></li></ul><div class="total"><span>Итого</span><strong th:text="${total}">Сумма</strong></div><p class="muted">Номер заказа: <span th:text="${order.id()}">UUID</span></p><p>Сохраните ссылку на эту страницу — чек доступен и после перезапуска.</p><a class="primary" href="/">Вернуться к книгам →</a></div></main></body></html>
